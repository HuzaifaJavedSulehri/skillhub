<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillHub - Modern Learning Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090919;
  --panel: #11112b;
  --panel-hover: #17173a;
  --line: #22224c;
  --text: #f1f0fc;
  --mute: #9492bf;
  --pri: #7c5cff;
  --pri2: #947bff;
  --pri-glow: rgba(124, 92, 255, 0.25);
  --ok: #2fd18b;
  --bad: #ff5d73;
  --gold: #ffb800;
  --input-bg: #0c0c24;
  --card-shadow: 0 8px 24px rgba(0,0,0,0.35);
  box-sizing: border-box;
}

[data-theme="light"] {
  --bg: #f8fafc;
  --panel: #ffffff;
  --panel-hover: #f1f5f9;
  --line: #e2e8f0;
  --text: #0f172a;
  --mute: #64748b;
  --pri: #6366f1;
  --pri2: #4f46e5;
  --pri-glow: rgba(99, 102, 241, 0.16);
  --ok: #10b981;
  --bad: #ef4444;
  --gold: #f59e0b;
  --input-bg: #f1f5f9;
  --card-shadow: 0 8px 20px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; transition: background-color 0.2s ease, border-color 0.2s ease; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 10px 18px;
  background: var(--pri);
  color: #fff;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 12px var(--pri-glow);
  transition: all 0.2s ease;
}
button:hover { background: var(--pri2); transform: translateY(-1px); }
button:active { transform: translateY(0); }
button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); box-shadow: none; }
button.ghost:hover { background: var(--panel-hover); border-color: var(--pri); }
button:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

input, select, textarea {
  font: inherit;
  width: 100%;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--input-bg);
  color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--pri2);
  box-shadow: 0 0 0 3px var(--pri-glow);
}

.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -0.5px; }
.logo i {
  width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--pri), var(--pri2));
  display: grid; place-items: center; font-style: normal; font-size: 14px; color: #fff;
  box-shadow: 0 4px 10px var(--pri-glow);
}

header {
  display: flex; align-items: center; gap: 18px; padding: 14px 28px;
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 20;
}
header .sp { flex: 1; }
header input { max-width: 260px; padding: 8px 14px; border-radius: 99px; }

.nav { display: flex; gap: 14px; }
.nav a {
  cursor: pointer; color: var(--mute); font-weight: 500; padding: 6px 12px; border-radius: 8px;
  transition: all 0.2s;
}
.nav a:hover { color: var(--text); background: var(--panel-hover); }
.nav a.on { color: var(--text); font-weight: 700; background: var(--panel-hover); }

.wrap { max-width: 1220px; margin: 0 auto; padding: 28px 24px; }
h1 { font-size: 28px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.5px; }
h2 { font-size: 21px; font-weight: 700; margin: 32px 0 16px; letter-spacing: -0.3px; }
.mute { color: var(--mute); }

.xp-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
  background: rgba(255, 184, 0, 0.15); border: 1px solid rgba(255, 184, 0, 0.3);
  border-radius: 99px; color: var(--gold); font-weight: 700; font-size: 13px;
}
.theme-btn {
  background: transparent; border: 1px solid var(--line); color: var(--text);
  padding: 8px; border-radius: 9px; cursor: pointer; display: grid; place-items: center;
  box-shadow: none; width: 38px; height: 38px;
}
.theme-btn:hover { background: var(--panel-hover); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.card {
  background: var(--card-bg); border: 1px solid var(--line); border-radius: 14px;
  overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  box-shadow: var(--card-shadow);
}
.card:hover { transform: translateY(-3px); border-color: var(--pri); }
.thumb { height: 130px; display: grid; place-items: center; font-size: 44px; font-weight: 800; position: relative; }
.card .b { padding: 16px; }
.card h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; line-height: 1.35; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--pri), var(--pri2)); border-radius: 99px; transition: width 0.6s ease; }

/* ---- COMPLETED BADGE ON CARD ---- */
.done-badge {
  position: absolute; top: 10px; right: 10px;
  background: var(--ok); color: #06281b;
  font-size: 11px; font-weight: 800; padding: 3px 9px;
  border-radius: 99px; letter-spacing: 0.5px;
}

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; align-items: center; }
.chip {
  padding: 7px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel);
  color: var(--mute); font-weight: 600; font-size: 13px; box-shadow: none;
}
.chip:hover { color: var(--text); border-color: var(--pri); background: var(--panel-hover); }
.chip.on { background: var(--pri); color: #fff; border-color: var(--pri); box-shadow: 0 4px 10px var(--pri-glow); }

.course { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
.player { aspect-ratio: 16/9; background: #000; border-radius: 14px; overflow: hidden; position: relative; box-shadow: var(--card-shadow); }
.player iframe, .player #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; align-self: start; }
.v { display: flex; gap: 10px; align-items: center; padding: 11px; border-radius: 9px; cursor: pointer; font-size: 14px; font-weight: 500; }
.v:hover { background: var(--panel-hover); }
.v.cur { background: rgba(124, 92, 255, 0.16); color: var(--pri2); font-weight: 700; }
.v.lock { opacity: .45; cursor: not-allowed; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; flex: none; }
.v.done .dot { background: var(--ok); border-color: var(--ok); color: #06281b; font-weight: 800; }

.quiz { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--card-shadow); }
.q { margin: 18px 0; }
.opt { display: block; padding: 12px 16px; margin: 9px 0; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: all 0.15s; background: var(--input-bg); }
.opt:hover { border-color: var(--pri); background: var(--panel-hover); }
.opt:has(input:checked) { border-color: var(--pri); background: rgba(124, 92, 255, 0.14); font-weight: 600; }
.opt input { width: auto; margin-right: 10px; accent-color: var(--pri); }
.res { padding: 16px; border-radius: 10px; margin: 16px 0; font-weight: 600; }
.res.ok { background: rgba(47, 209, 139, 0.15); border: 1px solid rgba(47, 209, 139, 0.35); color: var(--ok); }
.res.no { background: rgba(255, 93, 115, 0.15); border: 1px solid rgba(255, 93, 115, 0.35); color: var(--bad); }

/* ---- QUIZ RESULT SCREEN ---- */
.result-screen {
  text-align: center;
  padding: 32px 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--card-shadow);
}
.result-icon { font-size: 72px; margin-bottom: 12px; line-height: 1; }
.result-score-ring {
  width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px;
  display: grid; place-items: center; font-size: 28px; font-weight: 800;
  border: 5px solid var(--ok);
  background: rgba(47,209,139,0.1);
  color: var(--ok);
}
.result-score-ring.fail { border-color: var(--bad); background: rgba(255,93,115,0.1); color: var(--bad); }
.result-stats-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 18px 0; }
.result-stat { background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; min-width: 110px; }
.result-stat b { display: block; font-size: 22px; font-weight: 800; }
.result-stat span { font-size: 12px; color: var(--mute); }
.result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }

.notes-box { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.notes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.notes-box textarea { width: 100%; min-height: 110px; resize: vertical; padding: 12px; border-radius: 10px; font-family: inherit; }

.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 50% 20%, rgba(124, 92, 255, 0.15), transparent 60%), var(--bg); }
.login .box { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 32px; box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
.login label { display: block; margin: 14px 0 6px; color: var(--mute); font-size: 13px; font-weight: 600; }
.pw-wrap { position: relative; display: flex; align-items: center; }
.pw-wrap input { padding-right: 44px; }
.eye-btn { position: absolute; right: 10px; background: transparent; border: none; padding: 6px; color: var(--mute); cursor: pointer; font-size: 16px; box-shadow: none; border-radius: 6px; }
.eye-btn:hover { background: var(--panel-hover); color: var(--text); }
.err { color: var(--bad); margin-top: 10px; min-height: 20px; font-size: 13px; font-weight: 600; }

.hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 36px; align-items: center; padding: 40px 0; }
.hero-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--pri2); margin-bottom: 14px; }
.big { font-size: 46px; line-height: 1.1; margin: 0 0 14px; font-weight: 800; letter-spacing: -1px; }
.hero-card {
  background: linear-gradient(135deg, rgba(124, 92, 255, 0.15), rgba(47, 209, 139, 0.05)), var(--panel);
  border: 1px solid rgba(124, 92, 255, 0.35); border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  position: relative; overflow: hidden;
}
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.hero-stat b { display: block; font-size: 20px; color: var(--text); }
.hero-stat span { font-size: 12px; color: var(--mute); }

/* ---- CONTINUE WATCHING BANNER ---- */
.continue-banner {
  display: flex; align-items: center; gap: 18px; padding: 18px 22px;
  background: linear-gradient(90deg, rgba(124,92,255,0.15), rgba(47,209,139,0.05)), var(--panel);
  border: 1px solid rgba(124,92,255,0.4); border-radius: 16px; margin-bottom: 24px;
  cursor: pointer; transition: transform 0.2s, border-color 0.2s;
  box-shadow: var(--card-shadow);
}
.continue-banner:hover { transform: translateY(-2px); border-color: var(--pri); }
.continue-thumb {
  width: 60px; height: 60px; border-radius: 12px;
  display: grid; place-items: center; font-size: 22px; font-weight: 800; flex: none;
}
.continue-info { flex: 1; min-width: 0; }
.continue-info b { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.continue-info .mute { font-size: 13px; margin-top: 2px; }
.continue-bar { margin-top: 8px; }

.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.cat { background: var(--panel); border: 1px solid var(--line); text-align: left; display: flex; flex-direction: column; gap: 4px; color: var(--text); padding: 16px; border-radius: 12px; box-shadow: none; }
.cat:hover { border-color: var(--pri); transform: translateY(-2px); }

.creators { display: flex; gap: 14px; flex-wrap: wrap; }
.cr { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 140px; }
.av { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--pri), var(--pri2)); display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 16px; box-shadow: 0 4px 10px var(--pri-glow); }

.podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 24px 0 32px; align-items: flex-end; }
.podium-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; text-align: center; position: relative; box-shadow: var(--card-shadow); }
.podium-card.first { border-color: var(--gold); background: linear-gradient(180deg, rgba(255, 184, 0, 0.12), var(--panel)); transform: scale(1.04); }
.podium-badge { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; font-size: 22px; font-weight: 800; background: var(--line); }
.podium-card.first .podium-badge { background: var(--gold); color: #000; box-shadow: 0 0 18px rgba(255, 184, 0, 0.4); }
.podium-card.second .podium-badge { background: #cbd5e1; color: #0f172a; }
.podium-card.third .podium-badge { background: #d97706; color: #fff; }

.lb-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 14px; }
.lb-table th { padding: 10px 14px; color: var(--mute); font-size: 13px; text-align: left; font-weight: 600; }
.lb-row { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; transition: transform 0.15s; }
.lb-row td { padding: 14px 16px; font-size: 14px; }
.lb-row td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; font-weight: 700; width: 50px; }
.lb-row td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
.lb-row.me { border: 2px solid var(--pri); background: rgba(124, 92, 255, 0.12); }
.lb-row:hover { transform: translateX(3px); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--card-shadow); }
.stat b { font-size: 28px; display: block; font-weight: 800; color: var(--text); }
.tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin: 20px 0; }
.tabs button { background: none; color: var(--mute); border-radius: 0; border-bottom: 2px solid transparent; box-shadow: none; padding: 10px 16px; }
.tabs button.on { color: var(--text); border-color: var(--pri); font-weight: 700; }
.dh { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.dh .thumb { width: 140px; height: 120px; border-radius: 16px; }
.rowc { display: flex; gap: 14px; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin: 10px 0; flex-wrap: wrap; }
.side { display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
.cta { margin: 40px 0; padding: 32px; border-radius: 18px; background: linear-gradient(135deg, #37288f, #6d4aff); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; box-shadow: 0 12px 32px var(--pri-glow); }
.foot { border-top: 1px solid var(--line); padding: 24px 0; color: var(--mute); font-size: 13px; }
.hide { display: none !important; }

/* ---- STUDENT PROFILE PAGE ---- */
.profile-header {
  display: flex; align-items: center; gap: 22px; padding: 28px;
  background: linear-gradient(135deg, rgba(124,92,255,0.12), rgba(47,209,139,0.04)), var(--panel);
  border: 1px solid rgba(124,92,255,0.3); border-radius: 20px; margin-bottom: 24px;
  box-shadow: var(--card-shadow);
}
.profile-avatar {
  width: 80px; height: 80px; border-radius: 50%; flex: none;
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  display: grid; place-items: center; font-size: 28px; font-weight: 800; color: #fff;
  box-shadow: 0 8px 20px var(--pri-glow);
}
.profile-info h2 { margin: 0 0 4px; font-size: 22px; }
.profile-info .mute { font-size: 14px; }
.profile-stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
.pstat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--card-shadow); }
.pstat .pstat-icon { font-size: 24px; margin-bottom: 6px; }
.pstat b { font-size: 24px; display: block; font-weight: 800; }
.pstat span { font-size: 12px; color: var(--mute); }
.level-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; margin-top: 6px; }
.level-badge.beginner { background: rgba(47,209,139,0.15); color: var(--ok); border: 1px solid rgba(47,209,139,0.3); }
.level-badge.intermediate { background: rgba(124,92,255,0.15); color: var(--pri2); border: 1px solid rgba(124,92,255,0.3); }
.level-badge.advanced { background: rgba(255,184,0,0.15); color: var(--gold); border: 1px solid rgba(255,184,0,0.3); }
.level-badge.master { background: rgba(255,93,115,0.15); color: var(--bad); border: 1px solid rgba(255,93,115,0.3); }
.xp-progress-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 24px; }
.xp-bar-track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--pri), var(--pri2)); border-radius: 99px; transition: width 1s ease; }
.course-progress-list { display: flex; flex-direction: column; gap: 10px; }
.cp-row { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.cp-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; font-weight: 800; flex: none; }
.cp-info { flex: 1; min-width: 0; }
.cp-info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cp-info .mute { font-size: 12px; }
.cp-bar { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.cp-bar > div { height: 100%; background: linear-gradient(90deg, var(--pri), var(--ok)); border-radius: 99px; }

@media(max-width: 860px) {
  .course, .side, .hero, .podium { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr; }
  header { padding: 12px 16px; flex-wrap: wrap; }
  .wrap { padding: 16px; }
  .big { font-size: 34px; }
  .hero-card { margin-top: 10px; }
  .continue-banner { flex-wrap: wrap; }
  .profile-header { flex-direction: column; text-align: center; }
}

.hamburger-btn {
  display: none;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 9px;
  font-size: 20px;
  cursor: pointer;
  box-shadow: none;
}
.hamburger-btn:hover { background: var(--panel-hover); }

.mobile-menu {
  display: none;
  position: fixed;
  top: 65px;
  left: 0;
  right: 0;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding: 20px;
  z-index: 999;
  box-shadow: 0 16px 30px rgba(0,0,0,0.5);
  animation: slideDown 0.2s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
.mobile-menu.open { display: block; }
.mobile-nav { display: flex; flex-direction: column; gap: 10px; }
.mobile-nav a {
  padding: 12px 16px;
  border-radius: 10px;
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
.mobile-nav a:hover { background: var(--panel-hover); border-color: var(--pri); }

@media(max-width: 860px) {
  .nav { display: none !important; }
  .hamburger-btn { display: inline-flex !important; }
  header input { max-width: 160px; }
}


/* ---- Home page: sections & creators ---- */
.sec-head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin:38px 0 14px; }
.sec-head h2 { margin:0 0 2px; font-size:24px; }
.creator-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }

// Pure JS Particle Confetti for Quiz Celebrations
function launchConfetti() {
  const canvas = document.createElement("canvas");
  canvas.style.position = "fixed";
  canvas.style.inset = "0";
  canvas.style.width = "100vw";
  canvas.style.height = "100vh";
  canvas.style.pointerEvents = "none";
  canvas.style.zIndex = "99999";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const colors = ["#7c5cff", "#2fd18b", "#ffb800", "#ff5d73", "#38bdf8", "#ec4899", "#a855f7"];
  for (let i = 0; i < 90; i++) {
    particles.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 260,
      y: canvas.height * 0.45 + (Math.random() - 0.5) * 80,
      vx: (Math.random() - 0.5) * 18,
      vy: (Math.random() - 1.2) * 16 - 4,
      size: Math.random() * 9 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rSpeed: (Math.random() - 0.5) * 14,
      alpha: 1,
      decay: Math.random() * 0.012 + 0.012
    });
  }
  let anim;
  function step() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = 0;
    for (let p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;
      p.rotation += p.rSpeed;
      p.alpha -= p.decay;
      if (p.alpha > 0) {
        active++;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        ctx.restore();
      }
    }
    if (active > 0) {
      anim = requestAnimationFrame(step);
    } else {
      cancelAnimationFrame(anim);
      canvas.remove();
    }
  }
  anim = requestAnimationFrame(step);
}

// COURSES CATALOG with Search + Filter
function dash(cat) {
  cat = cat || window._cat || "All";
  window._cat = cat; cur = null;
  const q = $("#search").value.toLowerCase();
  const cats = ["All", ...new Set(COURSES.map(c => c.cat))];
  const L = window._lv || "All", S = window._so || "Default";
  const lo = ["All","Beginner","Intermediate","Advanced"].map(x => `<option value="${x}" ${x === L ? "selected" : ""}>${x === "All" ? "All levels" : x}</option>`).join("");
  const so = ["Default","A-Z","Progress"].map(x => `<option value="${x}" ${x === S ? "selected" : ""}>Sort: ${x}</option>`).join("");
  let list = COURSES.filter(c => (cat === "All" || c.cat === cat) && (L === "All" || lvl(c) === L) && c.t.toLowerCase().includes(q));
  if (S === "A-Z") list.sort((a, b) => a.t.localeCompare(b.t));
  if (S === "Progress") list.sort((a, b) => (done(b.id)/b.v.length) - (done(a.id)/a.v.length));

  $("#main").innerHTML = `

      ${cats.map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${c}">${c}</button>`).join("")}
    </div>
    <div class="grid">${list.map(c => {
      const d = done(c.id), pc = Math.round(d / c.v.length * 100);
      const isComplete = d >= c.v.length;
      return `<div class="card" tabindex="0" data-id="${c.id}">
        <div class="thumb" style="background:${COL[c.c % COL.length]}22;color:${COL[c.c % COL.length]};position:relative">

        <div class="b">
          <h3>${esc(c.t)}</h3>
          <div class="mute">${esc(c.by)} · ${c.v.length} lessons · ${lvl(c)}</div>
          <div class="bar"><div style="width:${pc}%"></div></div>
          <div class="mute" style="font-size:12px;margin-top:6px">${isComplete ? '✅ Completed!' : pc + '% complete'}</div>
        </div>
      </div>`;
    }).join("") || '<p class="mute">No course matches your search.</p>'}</div>
  `;

  $("#so").onchange = e => { window._so = e.target.value; dash(); };

  document.querySelectorAll(".card").forEach(b => {
    b.onclick = () => detail(b.dataset.id);
    b.onkeydown = e => { if (e.key === "Enter") detail(b.dataset.id); };
  });
}

const shuffle = a => {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// QUIZ with Result Screen
function quiz() {
  try { ytp && ytp.destroy && ytp.destroy(); } catch(e) {}
  ytp = null;
  const v = cur.v[vi];
  if (!v[2].length) {
    const last = vi === cur.v.length - 1;
    if (done(cur.id) === vi) {
      const p = store.get(); p[cur.id] = vi + 1; store.set(p);
      updateXPHeader();
    }
    $("#stage").innerHTML = `
      <div class="quiz">
        <h2 style="margin-top:0">${esc(v[0])}</h2>
        <div class="mute">No quiz for this video. Lesson completed!</div>
        <p><button id="nx">${last ? "Back to Dashboard" : "Next Video"}</button></p>
      </div>
    `;
    $("#nx").onclick = () => { if (last) go("dash"); else { vi++; course(); } };
    return;
  }

  // Shuffle questions AND options on every attempt
  const qs = shuffle(v[2]).map(q => {
    const order = shuffle(q[1].map((_, i) => i));
    return [q[0], order.map(i => q[1][i]), order.indexOf(q[2])];
  });

  $("#stage").innerHTML = `
    <div class="quiz">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0">Quiz: ${esc(v[0])}</h2>
        <span class="xp-badge">Reward: +50 XP</span>
      </div>
      <div class="mute" style="margin-top:4px">Score ${Math.round(PASS * 100)}% or higher to unlock the next lecture.</div>
      ${qs.map((q, i) => `
        <div class="q">
          <b>${i + 1}. ${esc(q[0])}</b>
          ${q[1].map((o, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`).join("")}
        </div>
      `).join("")}
      <div id="res"></div>
      <button id="sub">Submit Quiz Answers</button>
    </div>
  `;

  $("#sub").onclick = () => {
    const answered = qs.filter((q, i) => document.querySelector(`input[name=q${i}]:checked`)).length;
    if (answered < qs.length) {
      $("#res").innerHTML = `<div class="res no">⚠️ Please answer all questions first (${answered}/${qs.length} answered).</div>`;
      return;
    }

    let ok = 0;
    qs.forEach((q, i) => {
      const s = document.querySelector(`input[name=q${i}]:checked`);
      if (+s.value === q[2]) ok++;
      document.querySelectorAll(`input[name=q${i}]`).forEach(optInput => {
        const lbl = optInput.closest(".opt");
        const val = +optInput.value;
        optInput.disabled = true;
        if (lbl) {
          if (val === q[2]) {
            lbl.style.borderColor = "var(--ok)";
            lbl.style.background = "rgba(47, 209, 139, 0.2)";
          } else if (val === +s.value) {
            lbl.style.borderColor = "var(--bad)";
            lbl.style.background = "rgba(255, 93, 115, 0.2)";
          }
        }
      });
    });

    const pass = ok / qs.length >= PASS;
    const last = vi === cur.v.length - 1;
    const pct = Math.round(ok / qs.length * 100);

    if (pass) {
      launchConfetti();
      if (done(cur.id) === vi) {
        const p = store.get(); p[cur.id] = vi + 1; store.set(p);
        updateXPHeader();
      }

      // PASS RESULT SCREEN
      $("#stage").innerHTML = `
        <div class="result-screen">
          <div class="result-icon">🎉</div>
          <h2 style="margin:0 0 4px;color:var(--ok)">Quiz Passed!</h2>
          <div class="mute" style="margin-bottom:18px">${last ? "You completed this course!" : "Next lecture is now unlocked!"}</div>
          <div class="result-score-ring">${pct}%</div>
          <div class="result-stats-row">
            <div class="result-stat">
              <b style="color:var(--ok)">${ok}/${qs.length}</b>
              <span>Correct answers</span>
            </div>
            <div class="result-stat">
              <b style="color:var(--gold)">+50</b>
              <span>XP Earned</span>
            </div>
            <div class="result-stat">
              <b style="color:var(--pri2)">${getTotalPassed(user) * 50}</b>
              <span>Total XP</span>
            </div>
          </div>
          ${last ? `<div style="padding:14px;background:rgba(47,209,139,0.1);border:1px solid rgba(47,209,139,0.3);border-radius:12px;color:var(--ok);font-weight:700;margin-bottom:16px">🏆 Course 100% Completed! You're amazing!</div>` : ""}
          <div class="result-btns">
            ${last
              ? `<button id="nx">🏠 Back to Dashboard</button><button class="ghost" id="view-lb">View Leaderboard 🏆</button>`
              : `<button id="nx">Next Video →</button><button class="ghost" id="rw">Rewatch Video</button>`
            }
          </div>
        </div>
      `;
      $("#nx").onclick = () => { if (last) go("dash"); else { vi++; course(); } };
      if (last && $("#view-lb")) $("#view-lb").onclick = () => go("leaderboard");
      if (!last && $("#rw")) $("#rw").onclick = watch;

    } else {
      // FAIL RESULT SCREEN
      $("#stage").innerHTML = `
        <div class="result-screen">
          <div class="result-icon">😔</div>
          <h2 style="margin:0 0 4px;color:var(--bad)">Quiz Failed</h2>
          <div class="mute" style="margin-bottom:18px">You need ${Math.round(PASS*100)}% to pass. Keep trying!</div>
          <div class="result-score-ring fail">${pct}%</div>
          <div class="result-stats-row">
            <div class="result-stat">
              <b style="color:var(--bad)">${ok}/${qs.length}</b>
              <span>Correct answers</span>
            </div>
            <div class="result-stat">
              <b style="color:var(--mute)">${Math.ceil(PASS * qs.length) - ok}</b>
              <span>More needed</span>
            </div>
            <div class="result-stat">
              <b style="color:var(--pri2)">${getTotalPassed(user) * 50}</b>
              <span>Total XP</span>
            </div>
          </div>
          <div class="result-btns">
            <button id="rt">🔄 Retry Quiz</button>
            <button class="ghost" id="rw">📺 Rewatch Video</button>
          </div>
        </div>
      `;
      $("#rt").onclick = quiz;
      $("#rw").onclick = watch;
    }
  };
}

        <h2>${esc(USERS[user].name)}</h2>
        <div class="mute">Student ID: ${esc(user)}</div>
        <span class="level-badge ${level.cls}">${level.label}</span>
      </div>
    </div>

    <div class="profile-stats-grid">
      <div class="pstat">
        <div class="pstat-icon">⚡</div>
        <b style="color:var(--gold)">${xp}</b>
        <span>XP Earned</span>
      </div>
      <div class="pstat">
        <div class="pstat-icon">🏆</div>
        <b style="color:var(--pri2)">#${myRank}</b>
        <span>Class Rank</span>
      </div>
      <div class="pstat">
        <div class="pstat-icon">✅</div>
        <b style="color:var(--ok)">${tot}</b>
        <span>Lessons Passed</span>
      </div>
      <div class="pstat">
        <div class="pstat-icon">🎓</div>
        <b>${completedCourses.length}</b>
        <span>Courses Done</span>
      </div>
      <div class="pstat">
        <div class="pstat-icon">📚</div>
        <b style="color:var(--pri)">${inProgressCourses.length}</b>
        <span>In Progress</span>
      </div>
      <div class="pstat">
        <div class="pstat-icon">📊</div>
        <b>${totalLessons > 0 ? Math.round(tot / totalLessons * 100) : 0}%</b>
        <span>Overall Progress</span>
      </div>
    </div>

    <div class="xp-progress-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>XP Progress — ${levelNames[curLvlIdx]}</b>
        <span class="mute">${curLvlIdx < levels.length - 1 ? xp + ' / ' + nextXP + ' XP to ' + levelNames[curLvlIdx+1] : '🔥 Max Level Reached!'}</span>
      </div>
      <div class="xp-bar-track">
        <div class="xp-bar-fill" style="width:${xpPct}%"></div>
      </div>
      <div class="mute" style="font-size:12px">${xpPct}% to next level ${curLvlIdx < levels.length - 1 ? '· ' + (nextXP - xp) + ' XP remaining' : ''}</div>
    </div>

    <h2 style="margin-bottom:14px">📈 Course Progress</h2>
    <div class="course-progress-list">
      ${COURSES.map(c => {
        const d = p[c.id] || 0;
        const pc = Math.round(d / c.v.length * 100);
        const isComplete = d >= c.v.length;
        return `
          <div class="cp-row" style="cursor:pointer" data-cpid="${c.id}">
            <div class="cp-icon" style="background:${COL[c.c % COL.length]}22;color:${COL[c.c % COL.length]}">${c.ic}</div>
            <div class="cp-info">
              <b>${esc(c.t)}</b>
              <div class="mute">${d}/${c.v.length} lessons · ${isComplete ? '✅ Complete' : pc + '% done'}</div>
              <div class="cp-bar"><div style="width:${pc}%;background:${isComplete ? 'var(--ok)' : 'linear-gradient(90deg,var(--pri),var(--pri2))'}"></div></div>
            </div>
            <div style="font-size:14px;font-weight:700;color:${isComplete ? 'var(--ok)' : pc > 0 ? 'var(--pri2)' : 'var(--mute)'}">${isComplete ? '✓' : pc > 0 ? pc+'%' : '—'}</div>
          </div>
        `;
      }).join("")}
    </div>

    <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap">
      <button onclick="go('courses')">Browse Courses 📚</button>
      <button class="ghost" id="rst-btn">Reset my progress</button>
    </div>
  `;

  document.querySelectorAll("[data-cpid]").forEach(e => e.onclick = () => detail(e.dataset.cpid));
  const r = $("#rst-btn");
  if (r) r.onclick = () => {
    if (r.dataset.sure) { store.set({}); updateXPHeader(); profilePage(); }
    else { r.dataset.sure = 1; r.textContent = "Click again to confirm reset"; r.style.background = "var(--bad)"; }
  };
}

function detail(id, t) {
  const c = COURSES.find(x => x.id === id), d = done(id), n = c.v.length;
  t = t || "Overview";
  const body = {
    Overview: `<p>Learn ${esc(c.t)} step by step. Watch each video, then pass an interactive quiz (${Math.round(PASS * 100)}% to pass) to unlock the next lesson and earn +50 XP.</p><ul><li>${n} video lessons and ${n} quizzes</li><li>Level: ${lvl(c)}</li><li>Category: ${c.cat}</li></ul>`,
    "Course content": `<div class="list" style="max-width:640px">${c.v.map((x, i) => `<div class="v ${i < d ? "done" : ""} ${i > d ? "lock" : ""}"><span class="dot">${i < d ? "✓" : i > d ? "🔒" : ""}</span><span>${i + 1}. ${esc(x[0])}</span><span class="mute" style="margin-left:auto">${x[2].length ? x[2].length + " questions" : "No quiz"}</span></div>`).join("")}</div>`,
    Instructor: `<div class="cr" style="align-items:flex-start"><span class="av">${ini(c.by)}</span><b>${esc(c.by)}</b><span class="mute">${COURSES.filter(k => k.by === c.by).length} course(s) on SkillHub</span></div>`
  }[t];

  $("#main").innerHTML = `
    <button class="ghost" id="bk">← Back to courses</button>
    <div class="dh" style="margin-top:18px">
      ${th(c)}
      <div>
        <h1>${esc(c.t)}</h1>
        <div class="mute">${esc(c.by)} · ${lvl(c)} · ${n} lessons</div>
        <div class="bar" style="width:260px"><div style="width:${Math.round(d / n * 100)}%"></div></div>
        <div class="mute" style="font-size:12px;margin:6px 0 12px">${d}/${n} completed</div>
        <button id="st">${d === 0 ? "Start learning" : d >= n ? "Review course" : "Continue learning"}</button>
      </div>
    </div>
    <div class="tabs">${["Overview","Course content","Instructor"].map(k => `<button class="${k === t ? "on" : ""}" data-t="${k}">${k}</button>`).join("")}</div>
    ${body}
  `;
  $("#bk").onclick = () => go("courses");
  $("#st").onclick = () => openCourse(id);
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => detail(id, b.dataset.t));
}

// MY LEARNING / DASHBOARD
function mine(sec) {
  sec = sec || "Overview";
  const inp = COURSES.filter(c => done(c.id) > 0 && done(c.id) < c.v.length);
  const fin = COURSES.filter(c => done(c.id) >= c.v.length);
  const tot = COURSES.reduce((a, c) => a + done(c.id), 0);
  const xp = tot * 50;
  const row = c => `<div class="rowc"><b>${esc(c.t)}</b><span class="mute">${done(c.id)}/${c.v.length} videos</span><button data-o="${c.id}">${done(c.id) >= c.v.length ? "Review" : "Continue"}</button></div>`;
  const none = m => `<p class="mute">${m}</p>`;

  const secs = {
    Overview: `
      <h1>Welcome back, ${esc(USERS[user].name)}</h1>
      <div class="mute">Keep up the momentum. Every quiz passed earns you XP!</div>
      <div class="stats">
        <div class="stat"><span class="mute">XP Earned</span><b>⚡ ${xp} XP</b></div>
        <div class="stat"><span class="mute">In progress</span><b>${inp.length}</b></div>
        <div class="stat"><span class="mute">Videos passed</span><b>${tot}</b></div>
      </div>
      <h2 style="margin-top:0">Continue learning</h2>
      ${inp.map(row).join("") || none("Nothing in progress yet. Open Courses and start one.")}
    `,
    "In progress": `<h1>In progress</h1>${inp.map(row).join("") || none("No courses in progress.")}`,
    Completed: `<h1>Completed</h1>${fin.map(row).join("") || none("No completed courses yet.")}`,
    Profile: `
      <h1>Profile</h1>
      <div class="stat" style="max-width:380px">
        <b>${esc(USERS[user].name)}</b>
        <div class="mute" style="margin-top:6px">Student ID: ${esc(user)}</div>
        <div class="mute">Total XP: ⚡ ${xp} XP</div>
        <div class="mute">Videos passed: ${tot}</div>
      </div>
      <p style="margin-top:20px"><button onclick="go('profile')">View Full Profile →</button></p>
    `
  };

  $("#main").innerHTML = `
    <div class="side">
      <aside class="list">${Object.keys(secs).map(k => `<div class="v ${k === sec ? "cur" : ""}" data-s="${k}">${k}</div>`).join("")}</aside>
      <div>${secs[sec]}</div>
    </div>
  `;
  document.querySelectorAll("[data-s]").forEach(e => e.onclick = () => mine(e.dataset.s));
  document.querySelectorAll("[data-o]").forEach(e => e.onclick = () => openCourse(e.dataset.o));
}


// Hamburger Menu Controller
const mToggle = $("#menu-toggle");
const mMenu = $("#mobile-menu");
if (mToggle && mMenu) {
  mToggle.onclick = () => {
    const isOpen = mMenu.classList.toggle("open");
    mToggle.textContent = isOpen ? "✕" : "☰";
  };
  document.querySelectorAll("#mobile-menu a").forEach(a => {
    a.onclick = () => {
      mMenu.classList.remove("open");
      mToggle.textContent = "☰";
      go(a.dataset.v);
    };
  });
  if ($("#m-out")) $("#m-out").onclick = () => { mMenu.classList.remove("open"); $("#out").click(); };
}


boot();
</script>
</body>
</html>
