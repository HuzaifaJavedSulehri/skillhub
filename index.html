<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SkillHub - Modern Learning Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- LOGIN SECTION -->
  <section id="login" class="login">
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <div class="logo"><i>▶</i>SkillHub</div>
        <button class="theme-btn" id="login-theme" title="Toggle Light/Dark Theme">☀️</button>
      </div>
      <h1 style="font-size:24px">Welcome back</h1>
      <div class="mute" style="font-size:14px">Enter your assigned Student ID and password.</div>
      
      <label for="uid">Student ID</label>
      <input id="uid" placeholder="SH-1001" autocomplete="username">
      
      <label for="pw">Password</label>
      <div class="pw-wrap">
        <input id="pw" type="password" placeholder="Enter password" autocomplete="current-password">
        <button type="button" id="pw-toggle" class="eye-btn" title="Show / Hide Password">👁️</button>
      </div>
      
      <div class="err" id="err"></div>
      <button id="go" style="width:100%;margin-top:8px">Login to SkillHub</button>
    </div>
  </section>

  <!-- MAIN APPLICATION SHELL -->
  <div id="app" class="hide">
    <header>
      <button class="hamburger-btn" id="menu-toggle" aria-label="Toggle navigation menu">☰</button>
      <div class="logo" style="cursor:pointer" id="home"><i>▶</i>SkillHub</div>
      <nav class="nav" id="nav">
        <a data-v="home">Home</a>
        <a data-v="courses">Courses</a>
        <a data-v="leaderboard">Leaderboard 🏆</a>
        <a data-v="dash">My learning</a>
        <a data-v="profile">Profile 👤</a>
      </nav>
      <div class="sp"></div>
      <input id="search" placeholder="Search courses...">
      <div id="user-streak" class="streak-badge"><i>🔥</i> <span id="streak-num">1</span> Day Streak</div>
      <div id="user-xp" class="xp-badge">⚡ 0 XP</div>
      <span id="who" style="font-weight:600;font-size:14px"></span>
      <button class="theme-btn" id="app-theme" title="Toggle Light/Dark Theme">☀️</button>
      <button class="ghost" id="out" style="padding:7px 14px">Logout</button>
    </header>

    <!-- MOBILE MENU DRAWER -->
    <div class="mobile-menu" id="mobile-menu">
      <div class="mobile-nav">
        <a data-v="home">🏠 Home</a>
        <a data-v="courses">📚 Courses</a>
        <a data-v="leaderboard">🏆 Class Leaderboard</a>
        <a data-v="dash">🎓 My Learning</a>
        <a data-v="profile">👤 My Profile</a>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);gap:8px;flex-wrap:wrap">
        <div id="m-user-streak" class="streak-badge"><i>🔥</i> <span id="m-streak-num">1</span> Day Streak</div>
        <div id="m-user-xp" class="xp-badge">⚡ 0 XP</div>
        <button class="ghost" id="m-out" style="padding:6px 14px">Logout</button>
      </div>
    </div>

    <!-- MAIN VIEW CONTAINER -->
    <main class="wrap" id="main"></main>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- MODULAR APPLICATION SCRIPTS -->
  <script src="courses.js"></script>
  <script src="js/security.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
